services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devices
      POSTGRES_USER: devices
      POSTGRES_PASSWORD: devices
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devices -d devices"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "15432:5432"
    volumes:
      - performance-postgres-data:/var/lib/postgresql/data
    shm_size: 256mb
    mem_limit: 1g
    cpus: 1.0

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/devices
      DB_USER: devices
      DB_PASSWORD: devices
      DB_POOL_SIZE: 20
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError
    ports:
      - "${PERF_API_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 20
    mem_limit: 512m
    cpus: 1.0

  seed-data:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: devices
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./seed-data.sql:/performance/seed-data.sql:ro
    command:
      - psql
      - --host=postgres
      - --username=devices
      - --dbname=devices
      - --set=ON_ERROR_STOP=1
      - --file=/performance/seed-data.sql
    profiles: ["seed"]

volumes:
  performance-postgres-data:

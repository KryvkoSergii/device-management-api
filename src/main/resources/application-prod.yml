spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:1000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:500}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:120000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      data-source-properties:
        connectTimeout: ${DB_CONNECT_TIMEOUT_SECONDS:10}
        socketTimeout: ${DB_SOCKET_TIMEOUT_SECONDS:30}
        tcpKeepAlive: true
        ApplicationName: ${spring.application.name}
        sslmode: ${DB_SSL_MODE:verify-full}
        sslrootcert: ${DB_SSL_ROOT_CERT}
  jpa:
    show-sql: false
    properties:
      jakarta.persistence.query.timeout: ${DB_QUERY_TIMEOUT_MS:10000}
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  forward-headers-strategy: framework
  max-http-request-header-size: ${SERVER_MAX_HEADER_SIZE:16KB}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    connection-timeout: ${SERVER_CONNECTION_TIMEOUT:5s}
    keep-alive-timeout: ${SERVER_KEEP_ALIVE_TIMEOUT:20s}
    max-keep-alive-requests: ${SERVER_MAX_KEEP_ALIVE_REQUESTS:100}
    max-connections: ${SERVER_MAX_CONNECTIONS:1000}
    accept-count: ${SERVER_ACCEPT_COUNT:100}
    threads:
      max: ${SERVER_MAX_THREADS:50}
      min-spare: ${SERVER_MIN_SPARE_THREADS:10}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  openapi:
    enabled: false

logging:
  level:
    root: INFO
    com.ksa.devicemanagement: INFO
  structured:
    format:
      console: logstash
    json:
      context:
        include: true
      add:
        application: ${spring.application.name}
        version: ${APP_VERSION:unknown}
        environment: ${APP_ENVIRONMENT:production}

spring:
  application:
    name: device-management-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devices}
    username: ${DB_USER:devices}
    password: ${DB_PASSWORD:devices}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
server:
  shutdown: graceful
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi/device-management-api.yaml
    disable-swagger-default-url: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    com.ksa.devicemanagement: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

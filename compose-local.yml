services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devices
      POSTGRES_USER: devices
      POSTGRES_PASSWORD: devices
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U devices -d devices" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/devices
      DB_USER: devices
      DB_PASSWORD: devices
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness" ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 10
volumes:
  postgres-data:
